name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  analyze:
    name: Dart Analyze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: flutter-actions/setup-flutter@v4
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Generate code (drift, etc.)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Run Flutter analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
        continue-on-error: true

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: flutter-actions/setup-flutter@v4
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Generate code (drift, etc.)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Run unit tests
        run: flutter test --coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: coverage/lcov.info
          fail_ci_if_error: false

  # Regression gate: ensure no new lint violations are introduced
  regression-gate:
    name: Regression Gate
    runs-on: ubuntu-latest
    needs: [analyze, test]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: flutter-actions/setup-flutter@v4
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Run full analyze and capture issue count
        id: analyze
        run: |
          OUTPUT=$(flutter analyze 2>&1)
          echo "$OUTPUT"
          # Extract issue count from "X issues found"
          ISSUE_COUNT=$(echo "$OUTPUT" | grep -oE '[0-9]+ issues? found' | grep -oE '[0-9]+' | tail -1)
          echo "issue_count=$ISSUE_COUNT" >> $GITHUB_OUTPUT
          
          # Baseline from lint_baseline.md (3697 issues)
          BASELINE=3697
          
          if [ "$ISSUE_COUNT" -gt "$BASELINE" ]; then
            echo "::error::Lint regression detected! Current: $ISSUE_COUNT issues, Baseline: $BASELINE issues"
            exit 1
          else
            echo "Lint regression gate passed: $ISSUE_COUNT issues (baseline: $BASELINE)"
          fi

      - name: Verify no new errors
        run: |
          OUTPUT=$(flutter analyze 2>&1)
          ERROR_COUNT=$(echo "$OUTPUT" | grep -c "error -" || true)
          # Allow 1 pre-existing error in sync_service.dart
          if [ "$ERROR_COUNT" -gt 1 ]; then
            echo "::error::New errors detected! Error count: $ERROR_COUNT"
            echo "$OUTPUT" | grep "error -"
            exit 1
          else
            echo "Error gate passed: $ERROR_COUNT errors (baseline: 1)"
          fi